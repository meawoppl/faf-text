<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faf-text — GPU text renderer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #15161e; color: #c0caf5;
    font: 14px/1.5 system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: #1a1b26; border-bottom: 1px solid #2a2c3a;
  }
  header h1 { font-size: 16px; margin: 0; color: #7aa2f7; }
  header .stat {
    font-variant-numeric: tabular-nums; color: #9ece6a;
    background: #1f2130; border-radius: 6px; padding: 2px 10px;
  }
  header .badge { color: #bb9af7; background: #1f2130; border-radius: 6px; padding: 2px 10px; }
  label { display: flex; align-items: center; gap: 8px; color: #a9b1d6; }
  input[type="text"] {
    background: #1f2130; color: #c0caf5; border: 1px solid #2a2c3a;
    border-radius: 6px; padding: 4px 10px; width: 160px;
  }
  input[type="range"] { accent-color: #7aa2f7; }
  #canvas {
    display: block; width: 100%; height: calc(100vh - 57px);
    cursor: text; touch-action: none; outline: none;
  }
  /* The IME target: a 1×1 invisible input parked at the caret so the
     composition popup shows up where the text is being typed. */
  #ime {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    padding: 0; margin: 0; border: 0; outline: none; z-index: 10;
    opacity: 0; background: transparent; color: transparent;
    caret-color: transparent; font: 16px system-ui, sans-serif;
  }
  #fallback { padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>faf-text</h1>
  <span class="badge" id="backend">…</span>
  <span class="stat" id="fps">— fps</span>
  <label>font size <input type="range" id="size" min="8" max="160" value="18">
    <span id="sizeval" class="stat">18px</span></label>
  <label><input type="checkbox" id="pulse"> animate zoom</label>
  <label><input type="checkbox" id="wave"> weight wave</label>
  <label>highlight <input type="text" id="search" value="winding" placeholder="search text"></label>
  <span class="badge">click the text and type — it's editable</span>
</header>
<canvas id="canvas" tabindex="0"></canvas>
<input id="ime" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true">
<div id="fallback" hidden>
  <h2>WebGPU/WebGL2 unavailable</h2>
  <p id="fallback-msg"></p>
</div>

<script type="module">
import init, { FafTextDemo } from './pkg/faf_text_web.js';

const SAMPLE = `faf-text — a GPU text renderer that is fast as f***.

Every glyph on this page is drawn by a fragment shader deciding inside/outside against the glyph's quadratic Bézier curves with the non-zero winding rule. There is no glyph atlas for outlines, no re-rasterization on zoom, and antialiasing is analytic — the clamp of a crossing distance, not MSAA. Drag the font-size slider (or hit "animate zoom") and watch letterforms stay perfect at every scale; the curve data uploaded to the GPU never changes.

Selection is an instanced rect layer under the glyphs — click and drag to select. Highlights are an alpha-blended rect layer over the glyphs — type in the highlight box to mark every occurrence live. Both come from the same BiDi-aware cursor geometry, so mixed scripts select correctly.

Shaping is cosmic-text (pure Rust, compiled to wasm): Ελληνικά, кириллица, tiếng Việt, ﬁ ﬂ ligatures, and math like ∮ E⋅da = Q or ∀x∈ℝ: x² ≥ 0 all shape and render on the same code path. One draw call renders every solid rect, one draws every glyph.

The winding evaluation is exact even where rays graze curve endpoints — crossings are classified by the sign pattern of the control points, not by fragile root-range checks. Below ~24px, three parallel rays per axis recover hairline stems that single sampling would drop.

Click anywhere and type: this block is a real editable surface. Arrows move by grapheme (Ctrl for words, Home/End for the visual row), Shift extends the selection, Backspace deletes a whole grapheme cluster — emoji included. An IME composes inline, underlined, and commits in place. ${'Speed test: the quick brown fox jumps over the lazy dog 0123456789. '.repeat(40)}`;

async function main() {
  await init();
  const canvas = document.getElementById('canvas');
  const dpr = window.devicePixelRatio || 1;
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
  };
  fit();

  // Probe WebGPU from JS: wgpu can't recover from environments that expose
  // navigator.gpu but hand back a null adapter (e.g. headless).
  let forceGl = true;
  try {
    forceGl = !(navigator.gpu && await navigator.gpu.requestAdapter());
  } catch { forceGl = true; }

  let demo;
  try {
    demo = await FafTextDemo.attach(canvas, dpr, forceGl);
  } catch (e) {
    document.getElementById('canvas').hidden = true;
    document.getElementById('fallback').hidden = false;
    document.getElementById('fallback-msg').textContent = String(e);
    return;
  }
  document.getElementById('backend').textContent = demo.backend();
  window.demo = demo;  // console/debug access
  demo.set_text(SAMPLE);
  demo.set_search(document.getElementById('search').value);

  window.addEventListener('resize', () => {
    fit();
    demo.resize(canvas.width, canvas.height, window.devicePixelRatio || 1);
  });

  const ime = document.getElementById('ime');
  // Caret blink is host-side: 530ms on/off, restarted on every edit or motion.
  const BLINK = 530;
  let lastActivity = performance.now();
  let focused = false;
  const activity = () => { lastActivity = performance.now(); };

  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    demo.pointer_down(...pos(e));
    // Keyboard and IME events go to the hidden input, not the canvas.
    ime.focus({ preventScroll: true });
    activity();
  });
  canvas.addEventListener('pointermove', e => demo.pointer_move(...pos(e)));
  canvas.addEventListener('pointerup', () => { demo.pointer_up(); activity(); });
  canvas.addEventListener('focus', () => ime.focus({ preventScroll: true }));
  ime.addEventListener('focus', () => { focused = true; activity(); });
  ime.addEventListener('blur', () => { focused = false; });

  ime.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;  // the IME owns this key
    if (demo.key_input(e.key, e.ctrlKey || e.metaKey, e.shiftKey)) e.preventDefault();
    activity();
  });

  // IME: the preedit text lives in the Rust-side string so it shapes and
  // renders inline (underlined) at the caret, then commits in place.
  ime.addEventListener('compositionstart', () => { demo.composition_start(); activity(); });
  ime.addEventListener('compositionupdate', e => { demo.composition_update(e.data || ''); activity(); });
  ime.addEventListener('compositionend', e => {
    demo.composition_update(e.data || '');
    demo.composition_end(true);
    ime.value = '';
    activity();
  });

  document.addEventListener('copy', e => {
    const text = demo.selected_text();
    if (text) { e.clipboardData.setData('text/plain', text); e.preventDefault(); }
  });
  document.addEventListener('cut', e => {
    const text = demo.selected_text();
    if (!text) return;
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
    demo.key_input('Delete', false, false);
    activity();
  });

  const sizeInput = document.getElementById('size');
  const sizeVal = document.getElementById('sizeval');
  sizeInput.addEventListener('input', () => {
    sizeVal.textContent = `${sizeInput.value}px`;
    demo.set_font_size(Number(sizeInput.value));
  });
  document.getElementById('search').addEventListener('input',
    e => demo.set_search(e.target.value));

  // Paste inserts at the caret, replacing any selection.
  document.addEventListener('paste', e => {
    const text = e.clipboardData.getData('text/plain');
    if (!text) return;
    e.preventDefault();
    demo.insert_text(text);
    activity();
  });

  const pulse = document.getElementById('pulse');
  const wave = document.getElementById('wave');
  const fpsEl = document.getElementById('fps');
  let frames = 0, last = performance.now(), start = last;
  const tick = now => {
    // Weight is a GPU lerp between two masters of the variable font, so this
    // costs nothing per frame: no re-shape, no re-raster.
    demo.set_weight_blend(wave.checked
      ? 0.5 + 0.5 * Math.sin((now - start) / 700)
      : undefined);
    if (pulse.checked) {
      const s = 18 + 60 * (0.5 - 0.5 * Math.cos((now - start) / 900));
      sizeVal.textContent = `${s.toFixed(0)}px`;
      demo.set_font_size(s);
    }
    const blinkOn = Math.floor((now - lastActivity) / BLINK) % 2 === 0;
    demo.set_caret_visible(focused && blinkOn);
    // Park the IME input on the caret so composition popups land there.
    const [cx, cy, , ch] = demo.caret_css_rect();
    const box = canvas.getBoundingClientRect();
    ime.style.left = `${box.left + cx}px`;
    ime.style.top = `${box.top + cy + ch}px`;
    // render() returns false when the scene graph reports no damage: nothing
    // was re-recorded and nothing was presented, so it does not count as a
    // drawn frame. An idle demo sits at "idle" — that is the point.
    if (demo.render()) frames++;
    if (now - last > 500) {
      const fps = frames * 1000 / (now - last);
      fpsEl.textContent = frames === 0 ? 'idle' : `${fps.toFixed(0)} fps`;
      frames = 0; last = now;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
main();
</script>
</body>
</html>
