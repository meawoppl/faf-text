[workspace]
resolver = "2"
members = ["crates/faf-text", "crates/faf-text-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meawoppl/faf-text"

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
