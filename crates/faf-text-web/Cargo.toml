[package]
name = "faf-text-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
faf-text = { version = "0.1.0", path = "../faf-text" }
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = ["Window", "Document", "HtmlCanvasElement", "Element", "PointerEvent", "MouseEvent", "EventTarget", "CssStyleDeclaration", "DomRect", "Performance"] }
wgpu = { version = "30.0.0", features = ["webgl"] }
