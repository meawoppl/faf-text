<style>
/* Layout for the crate-root live demo grid (see lib.rs docs). Cells shrink
   responsively; the canvas is told its own backing size in device pixels, so
   text stays crisp on a HiDPI screen and a resize re-configures the surface. */
.faf-live-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 12px;
  align-items: start;
}
.faf-live-grid .faf-live {
  margin: 0;
}
.faf-live canvas {
  display: block;
  width: 100%;
  border-radius: 4px;
}
.faf-live img {
  max-width: 100%;
  border-radius: 4px;
}
.faf-live-caption {
  display: block;
  margin: 2px 0 0;
  font-size: 12px;
  opacity: 0.65;
}
</style>
<script type="module">
// faf-text live docs, loader stub. This file is baked into a published
// version's docs.rs pages, so the styles above and the markup they assume
// (`.faf-live` cells carrying `data-demo` and an `img` fallback, inside a
// `.faf-live-grid`, captioned by `.faf-live-caption`) are frozen until the next
// release. The driver that turns those placeholders into wasm canvases is
// fetched at page load from the gh-pages site root instead, so demo behaviour
// stays evergreen across every version of the docs at once — it lives at
// `web/docs-loader.js` in the repo.
//
// A failed import — offline docs, a blocked fetch, no network — is swallowed
// here, which leaves the APNG inside every placeholder visible and animating:
// the same fallback the live cells would otherwise have replaced.
import(
  window.FAF_DOCS_LOADER ||
    "https://meawoppl.github.io/faf-text/docs-loader.js"
).catch(() => {});
</script>
