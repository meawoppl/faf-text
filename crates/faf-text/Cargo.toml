[package]
name = "faf-text"
version = "0.2.1"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "GPU text renderer: glyph outlines evaluated per pixel in the fragment shader with the non-zero winding rule. Native, WebGPU and WebGL2, one code path."
readme = "README.md"
keywords = ["text-rendering", "gpu", "wgpu", "fonts", "wasm"]
categories = ["graphics", "rendering", "text-processing", "wasm"]

# Injects the live-demo loader into every docs.rs page: the `.faf-live`
# placeholders in the crate docs upgrade to wasm canvases driven by the
# gh-pages `demo/` bundle, with their APNG gallery images left as the fallback.
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs-header.html"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cosmic-text = "0.19.0"
etagere = "0.3.0"
glam = "0.33.3"
half = { version = "2.7.1", features = ["bytemuck"] }
rustc-hash = "2.1.3"
swash = { version = "0.2.10", default-features = false }
ttf-parser = "0.25.1"
unicode-segmentation = "1.13.3"
wgpu = { version = "30.0.0", features = ["webgl"] }

[dev-dependencies]
png = "0.18.1"
pollster = "1.0.1"
